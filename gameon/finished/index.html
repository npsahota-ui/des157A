<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen's Quarrel</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elsie+Swash+Caps:wght@400;900&family=Fleur+De+Leah&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Queen's Quarrel</h1>
        <p>In this game, two queens are fighting for power. The first queen to get to 30 wins. If she gets two ace's, her score is zeroed out. If the Queen card appears, she gets 10 points.</p>
    </header>

    <section class="sectionscore">
        <h2 id="queen1score">Queen 1: 0</h2>
        <h2 id="queen2score">Queen 2: 0</h2>
    </section>

    <div id="gamecontrol">
        <button id="startgame">Start</button>
    </div>

    <section class="game-area">
        <div class="queen-container">
            <img src="images/queen2img.png" alt="drawing of a second imaginary indian queen" height="480" width="380">
        </div>

        <div class="center-game">
            <div id="game"></div>
            <div id="actions"></div>
            <div id="quit-container"></div>
        </div>

        <div class="queen-container">
            <img src="images/queen1img.png" alt="drawing of an imaginary indian queen" height="450" width="350">
        </div>
    </section>

    <div id="score"></div>
</body>
</html>
