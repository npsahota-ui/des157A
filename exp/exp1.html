<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>experiment 1</title>
</head>
<body>
    <h1>experiment 1</h1>
    <h2>open the console to see the code!</h2>

    <script>
        //This is a program that takes a lowercase string and capitalizes the first letter of each word in the string.

        var lowerCase = "my name is nisha sahota";
        var upperCase = lowerCase.split (" ");
        var result = " ";
        //sequence: step 1 start loop
        //loop
        for(var i = 0; i < upperCase.length; i++) {
            //sequence: step 2 make first letter uppercase
            //selection
            if (upperCase[i].length > 0) {
                var letter = upperCase[i].charAt(0).toUpperCase();
                var letterTwo = upperCase[i].slice(1);
                result = result + letter + letterTwo + " ";
            }
        }

        console.log(result);
        
    </script>
</body>
</html>
