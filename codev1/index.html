<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>madlibs code v1</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Gamja+Flower&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet"

</head>
<body>

<header>
    <h1>Write to a Loved One</h1>
</header>

<section id="questions">
    <h2>I want to know...</h2>
    <form>
        <label for="lovedone"></label>1. Name of a loved one</label>
        <input type="text" name="lovedone" id="lovedone" required>

        <label for="describe">2. An adjective</label>
        <input type="text" name="describe" id="describe" required>

        <label for="activity">3. An activity you like to do together</label>
        <input type="text" name="activity" id="activity" required>

        <label for="favorite">4. Your favorite food</label>
        <input type="text" name="favorite" id="favorite" required>

        <label for="relationship">5.Their relationship to you. ex: friend, parent, etc</label>
        <input type="text" name="relationship" id="relationship" required>

        <label for="feelings">6. A feeling</label>
        <input type="text" name="feelings" id="feelings" required>

        <label for="name">7. Your name</label>
        <input type="text" name="name" id="name" required>
    </form>
</section>

</body>
</html>
